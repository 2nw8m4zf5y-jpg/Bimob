name: Build Bimob APK

on:
  push:
    branches: [ main, feature/model-core-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure native core
        run: cmake -S native-core -B build/native-core -DCMAKE_BUILD_TYPE=Debug -DBIMOB_NATIVE_ENABLE_SANITIZERS=ON
      - name: Build native core
        run: cmake --build build/native-core --parallel
      - name: Test native contracts
        run: ctest --test-dir build/native-core --output-on-failure
      - name: Build and test Kotlin core and Android app
        run: gradle :core:test testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bimob-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
